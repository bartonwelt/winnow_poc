<div id="sidebar_subnav" class="app-sidebar app-sidebar-subnav sidebar-lg">
    <div class="sidebar-content">
        <div class="sticky-top">
            <div class="mb-3">
                {% include sidebars/sidebar-section-header.html title="Defined Terms" link="Toggle All" %}
                <div class="accordion" id="termsAccordion">
                    {% for item in site.data.content.requirement.terms %}
                        <div class="accordion-item">
                            <h2 class="accordion-header" id="heading{{ forloop.index }}">
                                <button class="accordion-button {% unless forloop.first %}collapsed{% endunless %}" type="button" data-bs-toggle="collapse" data-bs-target="#collapse{{ forloop.index }}" aria-expanded="true" aria-controls="collapse{{ forloop.index }}">
                                    {{ item.title }}
                                </button>
                            </h2>
                            <div id="collapse{{ forloop.index }}" class="accordion-collapse collapse {% if forloop.first %}show{% endif %}" aria-labelledby="heading{{ forloop.index }}" data-bs-parent="#termsAccordion">
                                <div class="accordion-body">
                                    {{ item.desc }} <a href="{{ site.data.navigation.citation.link | relative_url }}">{{ item.citation }}</a>
                                    <div class="mt-3">
                                        <a href="{{ site.data.navigation.defined_term.link | relative_url }}">View More »</a>
                                    </div>
                                </div>
                            </div>
                        </div>
                    {% endfor %}
                </div>
            </div>
        </div>
    </div>
</div>
